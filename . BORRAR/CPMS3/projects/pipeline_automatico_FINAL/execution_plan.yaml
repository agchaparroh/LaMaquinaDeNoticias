# CPMS3 Execution Plan - Pipeline Automático EXACTO según especificación
# SIN problemas de corchetes - IMPLEMENTACIÓN DIRECTA

meta:
  id: "PIPELINE-AUTO-FINAL-001"
  name: "Pipeline Automático - Implementación Exacta"
  goal: "Implementar EXACTAMENTE el Pipeline Automático según especificación original"
  version: "3.0"
  created: "2025-01-02"

config:
  base_path: "/home/alvaro/proyectos/claude/LaMaquinaDeNoticias"
  staging_dir: ".cpms3_staging"
  max_retries: 3
  command_timeout: 300
  mode: "strict"

steps:
  # ========================================
  # PASO 1: Variables de entorno EXACTAS
  # ========================================
  - id: "STEP-001"
    description: "Añadir variables Pipeline Automático al .env.example"
    action: "modify_file"
    path: ".env.example"
    changes:
      - find: |
          # =============================================================================
          # CONFIGURACIÓN ESPECÍFICA POR MÓDULO
          # =============================================================================
        replace: |
          # =============================================================================
          # PIPELINE AUTOMÁTICO CON MODO DE DESARROLLO
          # =============================================================================
          DEVELOPMENT_MODE="false"
          ENABLE_PIPELINE_EXPORT="false"
          SCRAPY_OUTPUT_DIR="/data/scrapy_output/pending"
          DEVELOPMENT_OUTPUT_DIR="./development_outputs"
          PIPELINE_API_URL="http://module_pipeline:8003"

          # =============================================================================
          # CONFIGURACIÓN ESPECÍFICA POR MÓDULO
          # =============================================================================
    verify:
      - type: "file_contains"
        path: ".env.example"
        text: "DEVELOPMENT_MODE"
      - type: "file_contains"
        path: ".env.example"
        text: "./development_outputs"

  # ========================================
  # PASO 2: Estructura EXACTA de directorios
  # ========================================
  - id: "STEP-002"
    description: "Crear estructura EXACTA según especificación"
    action: "run_command"
    command: "mkdir -p development_outputs/01_articulos_extraidos/por_fecha development_outputs/02_fases_pipeline/fase_2_elementos_basicos/entidades_identificadas development_outputs/02_fases_pipeline/fase_2_elementos_basicos/hechos_extraidos development_outputs/02_fases_pipeline/fase_3_citas_datos/citas_textuales development_outputs/03_resultados_finales/exitosos development_outputs/03_resultados_finales/fallidos development_outputs/04_metricas_rendimiento development_outputs/05_comparativas"
    working_dir: "{base_path}"
    verify:
      - type: "command_succeeds"
        command: "test -d development_outputs/04_metricas_rendimiento"
      - type: "command_succeeds"
        command: "test -d development_outputs/01_articulos_extraidos"

  # ========================================
  # PASO 3: Archivos de métricas EXACTOS
  # ========================================
  - id: "STEP-003"
    description: "Crear archivos de métricas EXACTOS según especificación"
    action: "run_command"
    command: "echo '{}' > development_outputs/04_metricas_rendimiento/spider_stats.json && echo '{}' > development_outputs/04_metricas_rendimiento/content_quality.json && echo '{}' > development_outputs/04_metricas_rendimiento/pipeline_timing.json && echo '{}' > development_outputs/04_metricas_rendimiento/error_analysis.json"
    working_dir: "{base_path}"
    verify:
      - type: "file_exists"
        path: "development_outputs/04_metricas_rendimiento/spider_stats.json"
      - type: "file_exists"
        path: "development_outputs/04_metricas_rendimiento/content_quality.json"
      - type: "file_exists"
        path: "development_outputs/04_metricas_rendimiento/pipeline_timing.json"
      - type: "file_exists"
        path: "development_outputs/04_metricas_rendimiento/error_analysis.json"

  # ========================================
  # PASO 4: Import os en controller.py
  # ========================================
  - id: "STEP-004"
    description: "Añadir import os en controller.py"
    action: "modify_file"
    path: "src/module_pipeline/src/controller.py"
    changes:
      - find: |
          from typing import Dict, Any, Optional, List
          from datetime import datetime
          import time
          import threading
          from loguru import logger
        replace: |
          import os
          from typing import Dict, Any, Optional, List
          from datetime import datetime
          import time
          import threading
          from loguru import logger
    verify:
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "import os"

  # ========================================
  # PASO 5: Dual output EXACTO en controller.py
  # ========================================
  - id: "STEP-005"
    description: "Modificar controller.py líneas 835-837 para dual output EXACTO"
    action: "modify_file"
    path: "src/module_pipeline/src/controller.py"
    backup: true
    changes:
      - find: |
          resultado_persistencia = supabase_service.insertar_fragmento_completo(payload_dict)
        replace: |
          # DUAL OUTPUT según Pipeline_Automatico_Modo_Desarrollo.md
          if os.getenv('DEVELOPMENT_MODE', 'false').lower() == 'true':
              from .services.development_storage import DevelopmentStorageService
              dev_storage = DevelopmentStorageService(os.getenv('DEVELOPMENT_OUTPUT_DIR', './development_outputs'))
              resultado_persistencia = dev_storage.insertar_fragmento_completo(payload_dict)
              logger.info("DESARROLLO: Fragmento guardado en estructura exacta")
          else:
              resultado_persistencia = supabase_service.insertar_fragmento_completo(payload_dict)
              logger.info("PRODUCCION: Fragmento guardado en Supabase")
    verify:
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "DEVELOPMENT_MODE"
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "DevelopmentStorageService"
      - type: "syntax_valid"
        language: "python"
        path: "src/module_pipeline/src/controller.py"

rollback:
  enabled: true
  steps:
    - action: "restore_from_backup"
      pattern: "*.py"

final_validation:
  - type: "goal_achieved"
    checks:
      - "Variables exactas añadidas según especificación"
      - "Estructura /data/development_outputs/ exacta creada"
      - "Archivos métricas exactos (spider_stats.json, content_quality.json, pipeline_timing.json, error_analysis.json)"
      - "Controller.py modificado líneas 835-837 EXACTO"
      - "Import os añadido"
      - "Sintaxis Python válida"