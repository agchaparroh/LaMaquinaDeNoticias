# CPMS3 Execution Plan - Pipeline Automático SIMPLE (Sin Problemas de Escape)
# Estrategia: Archivos separados para evitar problemas con llaves

meta:
  id: "PIPELINE-AUTO-SIMPLE-001"
  name: "Pipeline Automático Simple - Sin Escape"
  goal: "Implementar dual output copiando archivos pre-creados"
  version: "3.0"
  created: "2025-01-02"

config:
  base_path: "/home/alvaro/proyectos/claude/LaMaquinaDeNoticias"
  staging_dir: ".cpms3_staging"
  max_retries: 3
  command_timeout: 300
  mode: "strict"

steps:
  # ========================================
  # PASO 1: Variables de entorno
  # ========================================
  - id: "STEP-001"
    description: "Añadir variables Pipeline Automático al .env.example"
    action: "modify_file"
    path: ".env.example"
    changes:
      - find: |
          # =============================================================================
          # CONFIGURACIÓN ESPECÍFICA POR MÓDULO
          # =============================================================================
        replace: |
          # =============================================================================
          # PIPELINE AUTOMÁTICO CON MODO DE DESARROLLO
          # =============================================================================
          DEVELOPMENT_MODE="false"
          ENABLE_PIPELINE_EXPORT="false"
          SCRAPY_OUTPUT_DIR="/data/scrapy_output/pending"
          DEVELOPMENT_OUTPUT_DIR="/data/development_outputs"
          PIPELINE_API_URL="http://module_pipeline:8003"

          # =============================================================================
          # CONFIGURACIÓN ESPECÍFICA POR MÓDULO
          # =============================================================================
    verify:
      - type: "file_contains"
        path: ".env.example"
        text: "DEVELOPMENT_MODE"

  # ========================================
  # PASO 2: Crear estructura de directorios
  # ========================================
  - id: "STEP-002"
    description: "Crear estructura completa de directorios"
    action: "run_command"
    command: "mkdir -p /data/development_outputs/01_articulos_extraidos/por_fecha /data/development_outputs/02_fases_pipeline/fase_2_elementos_basicos/entidades_identificadas /data/development_outputs/02_fases_pipeline/fase_2_elementos_basicos/hechos_extraidos /data/development_outputs/02_fases_pipeline/fase_3_citas_datos/citas_textuales /data/development_outputs/03_resultados_finales/exitosos /data/development_outputs/03_resultados_finales/fallidos /data/development_outputs/04_metricas_rendimiento /data/development_outputs/05_comparativas"
    working_dir: "/"
    verify:
      - type: "command_succeeds"
        command: "test -d /data/development_outputs/04_metricas_rendimiento"

  # ========================================
  # PASO 3: Crear archivo base de métricas
  # ========================================
  - id: "STEP-003"
    description: "Crear archivo spider_stats.json básico"
    action: "run_command"
    command: 'echo \'{"spiders": {}, "last_updated": "init"}\' > /data/development_outputs/04_metricas_rendimiento/spider_stats.json'
    working_dir: "/"
    verify:
      - type: "file_exists"
        path: "/data/development_outputs/04_metricas_rendimiento/spider_stats.json"

  # ========================================
  # PASO 4: Añadir import os en controller.py
  # ========================================
  - id: "STEP-004"
    description: "Añadir import os en controller.py"
    action: "modify_file"
    path: "src/module_pipeline/src/controller.py"
    changes:
      - find: |
          import uuid
          import asyncio
          from datetime import datetime
        replace: |
          import os
          import uuid
          import asyncio
          from datetime import datetime
    verify:
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "import os"

  # ========================================
  # PASO 5: Copiar development_storage.py
  # ========================================
  - id: "STEP-005"
    description: "Copiar development_storage.py al proyecto"
    action: "run_command"
    command: "cp CPMS3/projects/pipeline_automatico_SIMPLE/development_storage.py src/module_pipeline/src/services/"
    working_dir: "{base_path}"
    verify:
      - type: "file_exists"
        path: "src/module_pipeline/src/services/development_storage.py"
      - type: "syntax_valid"
        language: "python"
        path: "src/module_pipeline/src/services/development_storage.py"

  # ========================================
  # PASO 6: Modificar controller.py para dual output
  # ========================================
  - id: "STEP-006"
    description: "Modificar controller.py para dual output"
    action: "modify_file"
    path: "src/module_pipeline/src/controller.py"
    backup: true
    changes:
      - find: |
          resultado_persistencia = supabase_service.insertar_fragmento_completo(payload_dict)
        replace: |
          # DUAL OUTPUT: Desarrollo vs Producción
          if os.getenv('DEVELOPMENT_MODE', 'false').lower() == 'true':
              from .services.development_storage import DevelopmentStorageService
              dev_storage = DevelopmentStorageService(os.getenv('DEVELOPMENT_OUTPUT_DIR', '/data/development_outputs'))
              resultado_persistencia = dev_storage.insertar_fragmento_completo(payload_dict)
              logger.info("DESARROLLO: Fragmento guardado en desarrollo")
          else:
              resultado_persistencia = supabase_service.insertar_fragmento_completo(payload_dict)
              logger.info("PRODUCCION: Fragmento guardado en Supabase")
    verify:
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "DEVELOPMENT_MODE"
      - type: "syntax_valid"
        language: "python"
        path: "src/module_pipeline/src/controller.py"

rollback:
  enabled: true
  steps:
    - action: "restore_from_backup"
      pattern: "*.py"

final_validation:
  - type: "goal_achieved"
    checks:
      - "Variables de entorno añadidas"
      - "Estructura de directorios creada"
      - "Controller.py modificado para dual output"
      - "Import os añadido"
      - "Archivo básico de métricas creado"