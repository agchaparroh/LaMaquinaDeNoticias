  - id: "STEP-008"
    description: "Crear ThemeContext según sección 6.2 del plan"
    notes: |
      🚨 IMPERATIVO Context7: ANTES de crear theme context, consultar documentación oficial:
      - mcp__context7__resolve-library-id para "@mui/material"
      - mcp__context7__get-library-docs para Material-UI theming y createTheme
      - mcp__context7__resolve-library-id para "react-context"
      - mcp__context7__get-library-docs para Context patterns con localStorage
    action: "create_file"
    path: "src/contexts/ThemeContext.tsx"
    content: |
      import React, { createContext, useContext, useState, ReactNode } from 'react';
      import { createTheme, ThemeProvider as MuiThemeProvider } from '@mui/material/styles';
      import { IconButton } from '@mui/material';
      import { DarkMode as DarkModeIcon, LightMode as LightModeIcon } from '@mui/icons-material';

      // Según SECCIÓN 6.2 - Agregar toggle de tema con Context API EXACTO
      interface ThemeContextType {
        mode: 'light' | 'dark';
        toggleTheme: () => void;
      }

      const ThemeContext = createContext<ThemeContextType | undefined>(undefined);

      export const ThemeProvider: React.FC<{ children: ReactNode }> = ({ children }) => {
        const [mode, setMode] = useState<'light' | 'dark'>(() => {
          // Cargar tema guardado o usar el preferido del sistema
          const saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') return saved;
          
          return window.matchMedia('(prefers-color-scheme: dark)').matches 
            ? 'dark' 
            : 'light';
        });

        const toggleTheme = () => {
          const newMode = mode === 'light' ? 'dark' : 'light';
          setMode(newMode);
          localStorage.setItem('theme', newMode);
        };

        const theme = createTheme({
          palette: { mode }
        });

        return (
          <ThemeContext.Provider value={{ mode, toggleTheme }}>
            <MuiThemeProvider theme={theme}>
              {children}
            </MuiThemeProvider>
          </ThemeContext.Provider>
        );
      };

      // Hook personalizado
      export const useTheme = () => {
        const context = useContext(ThemeContext);
        if (!context) {
          throw new Error('useTheme must be used within ThemeProvider');
        }
        return context;
      };

      // Según SECCIÓN 6.2 - Componente ThemeToggle EXACTO
      export const ThemeToggle = () => {
        const { mode, toggleTheme } = useTheme();
        
        return (
          <IconButton onClick={toggleTheme} color="inherit">
            {mode === 'light' ? <DarkModeIcon /> : <LightModeIcon />}
          </IconButton>
        );
      };
    verify:
      - type: "file_exists"
        path: "src/contexts/ThemeContext.tsx"
      - type: "file_contains"
        path: "src/contexts/ThemeContext.tsx"
        text: "ThemeToggle"

