    action: "create_file"
    path: "src/components/PerformanceMonitor.tsx"
    content: |
      import React, { useState, useEffect } from 'react';
      import { Box, Typography, Grid } from '@mui/material';

      interface PerformanceMetrics {
        activeConnections: number;
        cacheHitRate: number;
        avgResponseTime: number;
        requestsPerMinute: number;
      }

      // Según SECCIÓN 19.1 - Monitor de rendimiento en tiempo real
      // Crear PerformanceMonitor.tsx:
      const PerformanceMonitor = () => {
        const [metrics, setMetrics] = useState<PerformanceMetrics>({
          activeConnections: 0,
          cacheHitRate: 0,
          avgResponseTime: 0,
          requestsPerMinute: 0
        });
        
        useEffect(() => {
          const ws = new WebSocket(`${import.meta.env.VITE_WS_URL || '/ws'}/metrics`);
          ws.onmessage = (event) => {
            setMetrics(JSON.parse(event.data));
          };
          return () => ws.close();
        }, []);
        
        return (
          <Box sx={{ p: 2 }}>
            <Typography variant="h6">Rendimiento del Sistema</Typography>
            <Grid container spacing={2}>
              <Grid item xs={6}>
                <Typography variant="body2" color="text.secondary">
                  Conexiones Redis activas
                </Typography>
                <Typography variant="h4">
                  {metrics.activeConnections}/50
                </Typography>
              </Grid>
              <Grid item xs={6}>
                <Typography variant="body2" color="text.secondary">
                  Cache Hit Rate
                </Typography>
                <Typography variant="h4">
                  {metrics.cacheHitRate.toFixed(1)}%
                </Typography>
              </Grid>
              <Grid item xs={6}>
                <Typography variant="body2" color="text.secondary">
                  Tiempo Promedio Respuesta
                </Typography>
                <Typography variant="h4">
                  {metrics.avgResponseTime.toFixed(0)}ms
                </Typography>
              </Grid>
              <Grid item xs={6}>
                <Typography variant="body2" color="text.secondary">
                  Requests por Minuto
                </Typography>
                <Typography variant="h4">
                  {metrics.requestsPerMinute}
                </Typography>
              </Grid>
            </Grid>
          </Box>
        );
      };

      export default PerformanceMonitor;
    verify:
      - type: "file_exists"
        path: "src/components/PerformanceMonitor.tsx"
      - type: "file_contains"
        path: "src/components/PerformanceMonitor.tsx"
        text: "PerformanceMonitor"

