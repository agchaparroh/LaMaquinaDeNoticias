  # ========================================
  # SECCIÓN 9 - OPTIMIZACIONES Y PERFORMANCE
  # ========================================
  - id: "STEP-029"
    description: "Implementar optimizaciones según sección 9 del plan EXACTO"
    notes: |
      🚨 IMPERATIVO Context7: ANTES de implementar optimizaciones, consultar documentación oficial:
      - mcp__context7__resolve-library-id para "react-lazy"
      - mcp__context7__get-library-docs para React.lazy y Suspense patterns
      - mcp__context7__resolve-library-id para "react-memo"
      - mcp__context7__get-library-docs para React.memo, useMemo, useCallback optimization
    action: "create_file"
    path: "src/utils/optimizations.tsx"
    content: |
      import React, { lazy, memo, useMemo, useCallback } from 'react';
      import { Suspense } from 'react';
      import { CircularProgress, Box } from '@mui/material';

      // Según SECCIÓN 9.1 - Code splitting por rutas
      export const WizardPage = lazy(() => import('../pages/WizardPage'));
      export const BulkUploadPage = lazy(() => import('../pages/BulkUploadPage'));
      export const HistoryPage = lazy(() => import('../pages/HistoryPage'));

      // Loading component for lazy routes
      export const LazyLoadingFallback = () => (
        <Box display="flex" justifyContent="center" alignItems="center" minHeight="200px">
          <CircularProgress />
        </Box>
      );

      // HOC para wrappear lazy components con Suspense
      export const withSuspense = (Component: React.LazyExoticComponent<React.ComponentType<any>>) => {
        return (props: any) => (
          <Suspense fallback={<LazyLoadingFallback />}>
            <Component {...props} />
          </Suspense>
        );
      };

      // Según SECCIÓN 9.2 - Memoización de componentes pesados
      export const MemoizedDataGrid = memo(({ rows, columns, ...props }: any) => {
        const processedRows = useMemo(() => {
          return rows.map((row: any, index: number) => ({
            id: row.id || index,
            ...row
          }));
        }, [rows]);

        return <DataGrid rows={processedRows} columns={columns} {...props} />;
      });

      export const MemoizedCodeBlock = memo(({ code, language }: any) => {
        return (
          <SyntaxHighlighter 
            language={language || 'python'}
            style={vscDarkPlus}
            showLineNumbers
            customStyle={{ borderRadius: 8 }}
          >
            {code}
          </SyntaxHighlighter>
        );
      });

      // Según SECCIÓN 9.3 - Hooks optimizados para evitar re-renders
      export const useOptimizedCallback = (callback: Function, deps: any[]) => {
        return useCallback(callback, deps);
      };

      export const useOptimizedMemo = (factory: () => any, deps: any[]) => {
        return useMemo(factory, deps);
      };

      // Hook para debounce optimizado
      export const useOptimizedDebounce = (value: any, delay: number) => {
        const [debouncedValue, setDebouncedValue] = useState(value);

        useEffect(() => {
          const handler = setTimeout(() => {
            setDebouncedValue(value);
          }, delay);

          return () => {
            clearTimeout(handler);
          };
        }, [value, delay]);

        return debouncedValue;
      };

      // Performance monitoring hook
      export const usePerformanceMonitor = (componentName: string) => {
        useEffect(() => {
          const startTime = performance.now();
          
          return () => {
            const endTime = performance.now();
            const renderTime = endTime - startTime;
            
            if (renderTime > 16) { // Más de 16ms indica posible lag
              console.warn(`${componentName} render time: ${renderTime.toFixed(2)}ms`);
            }
          };
        });
      };
    verify:
      - type: "file_exists"
        path: "src/utils/optimizations.tsx"
      - type: "file_contains"
        path: "src/utils/optimizations.tsx"
        text: "withSuspense"

  # ========================================
  # SECCIÓN 2.4 - VALIDACIÓN CSV
  # ========================================
  - id: "STEP-030"
    description: "Implementar validación CSV según sección 2.4 del plan EXACTO"
    notes: |
      🚨 IMPERATIVO Context7: ANTES de implementar CSV validation, consultar documentación oficial:
      - mcp__context7__resolve-library-id para "csv-parser"
      - mcp__context7__get-library-docs para CSV parsing y validation patterns
      - mcp__context7__resolve-library-id para "yup"
      - mcp__context7__get-library-docs para Yup array validation y object schemas
    action: "create_file"
    path: "src/utils/csvValidation.ts"
    content: |
      import * as yup from 'yup';
      import { AREAS_GEOGRAFICAS_OFICIALES } from '../constants/areas';

      // Según SECCIÓN 2.4 - Agregar validación de CSV
      // - Validar columnas obligatorias
      // - Validar valores de tipo_medio
      // - Validar URLs
      // - Mostrar errores por fila

      export interface CSVRow {
        medio: string;
        seccion: string;
        url: string;
        area_geografica: string;
        tipo_medio: string;
        frecuencia_minutos: number;
        rss_url?: string;
      }

      export interface CSVValidationError {
        row: number;
        field: string;
        message: string;
        value: any;
      }

      export interface CSVValidationResult {
        isValid: boolean;
        validRows: CSVRow[];
        errors: CSVValidationError[];
        totalRows: number;
      }

      // Schema para validar cada fila del CSV
      const csvRowSchema = yup.object({
        medio: yup.string().required('El medio es obligatorio'),
        seccion: yup.string().required('La sección es obligatoria'),
        url: yup.string().url('URL inválida').required('La URL es obligatoria'),
        area_geografica: yup
          .string()
          .oneOf(AREAS_GEOGRAFICAS_OFICIALES, 'Área geográfica no válida')
          .required('El área geográfica es obligatoria'),
        tipo_medio: yup
          .string()
          .oneOf(['diario', 'revista', 'agencia'], 'Tipo de medio inválido')
          .required('El tipo de medio es obligatorio'),
        frecuencia_minutos: yup
          .number()
          .positive('La frecuencia debe ser un número positivo')
          .integer('La frecuencia debe ser un número entero')
          .required('La frecuencia es obligatoria'),
        rss_url: yup.string().url('URL del RSS inválida').nullable()
      });

      export const parseCSV = (csvContent: string): any[] => {
        const lines = csvContent.trim().split('\n');
        const headers = lines[0].split(',').map(h => h.trim());
        
        return lines.slice(1).map(line => {
          const values = line.split(',').map(v => v.trim());
          const row: any = {};
          
          headers.forEach((header, index) => {
            let value = values[index] || '';
            
            // Convertir frecuencia_minutos a número
            if (header === 'frecuencia_minutos') {
              value = value ? parseInt(value, 10) : null;
            }
            
            row[header] = value;
          });
          
          return row;
        });
      };

      export const validateCSV = async (csvContent: string): Promise<CSVValidationResult> => {
        const errors: CSVValidationError[] = [];
        const validRows: CSVRow[] = [];
        
        try {
          const rows = parseCSV(csvContent);
          
          // Validar que el CSV tenga las columnas requeridas
          const requiredColumns = ['medio', 'seccion', 'url', 'area_geografica', 'tipo_medio'];
          const firstRow = rows[0] || {};
          const missingColumns = requiredColumns.filter(col => !(col in firstRow));
          
          if (missingColumns.length > 0) {
            errors.push({
              row: 0,
              field: 'estructura',
              message: `Faltan columnas obligatorias: ${missingColumns.join(', ')}`,
              value: null
            });
          }
          
          // Validar cada fila
          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const rowNumber = i + 1;
            
            try {
              const validatedRow = await csvRowSchema.validate(row, { abortEarly: false });
              validRows.push(validatedRow);
            } catch (validationError: any) {
              if (validationError.inner) {
                validationError.inner.forEach((error: any) => {
                  errors.push({
                    row: rowNumber,
                    field: error.path,
                    message: error.message,
                    value: row[error.path]
                  });
                });
              }
            }
          }
          
          return {
            isValid: errors.length === 0,
            validRows,
            errors,
            totalRows: rows.length
          };
          
        } catch (parseError) {
          errors.push({
            row: 0,
            field: 'formato',
            message: 'Error al procesar el archivo CSV. Verifique el formato.',
            value: null
          });
          
          return {
            isValid: false,
            validRows: [],
            errors,
            totalRows: 0
          };
        }
      };

      export const formatValidationErrors = (errors: CSVValidationError[]): string => {
        return errors.map(error => {
          if (error.row === 0) {
            return `Error: ${error.message}`;
          }
          return `Fila ${error.row}, campo "${error.field}": ${error.message}`;
        }).join('\n');
      };
    verify:
      - type: "file_exists"
        path: "src/utils/csvValidation.ts"
      - type: "file_contains"
        path: "src/utils/csvValidation.ts"
        text: "validateCSV"

