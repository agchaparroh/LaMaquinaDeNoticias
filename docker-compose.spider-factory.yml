version: '3.8'

# Override file para ejecutar Spider Factory de forma aislada
# Uso: docker-compose -f docker-compose.yml -f docker-compose.spider-factory.yml up -d

services:
  nginx_reverse_proxy:
    # Sobrescribir dependencias para incluir solo los servicios necesarios
    depends_on:
      - spider_factory_backend
      - spider_factory_frontend
      - redis
    # No necesitamos cambiar nada más, el resto viene del docker-compose.yml principal

  # Asegurar que redis esté disponible
  redis:
    # Redis no necesita cambios, solo lo incluimos para claridad
    # La configuración viene del archivo principal
    
  spider_factory_backend:
    # Backend no necesita cambios
    # La configuración viene del archivo principal
    
  spider_factory_frontend:
    # Frontend no necesita cambios
    # La configuración viene del archivo principal