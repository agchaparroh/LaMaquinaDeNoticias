# Configuración de Redis para La Máquina de Noticias
# Optimizada para desarrollo/producción

# Memoria
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistencia - Guardar en disco
# Después de 900 seg (15 min) si al menos 1 key cambió
save 900 1
# Después de 300 seg (5 min) si al menos 10 keys cambiaron
save 300 10
# Después de 60 seg si al menos 10000 keys cambiaron
save 60 10000

# Archivo de persistencia
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Limitar clientes
maxclients 10000

# Append only file (más durabilidad)
appendonly no
appendfilename "appendonly.aof"

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitor
latency-monitor-threshold 0

# Event notification
notify-keyspace-events ""

# Advanced config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Active rehashing
activerehashing yes

# Output buffers
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency
hz 10

# AOF rewrite
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb