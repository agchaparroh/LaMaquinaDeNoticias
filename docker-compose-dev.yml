version: '3.8'

# Docker Compose para desarrollo y pruebas del pipeline
# Incluye: module_scraper, module_connector, module_pipeline, scrapyd, scrapydweb
# Uso: docker-compose -f docker-compose-dev.yml up

networks:
  pipeline-dev-network:
    driver: bridge

services:
  # --- Module Scraper ---
  module_scraper:
    build:
      context: ./src/module_scraper
      dockerfile: Dockerfile
    container_name: dev-module-scraper
    volumes:
      - ./src/module_scraper:/app
      - ./pruebas_pipeline:/pruebas_pipeline
    environment:
      - DEVELOPMENT_MODE=true
      - ENABLE_PIPELINE_EXPORT=true
      - EXPORT_DIRECTORY=/pruebas_pipeline/scrapy_output/pending
    env_file:
      - .env
    networks:
      - pipeline-dev-network
    restart: unless-stopped

  # --- Module Connector ---
  module_connector:
    build:
      context: ./src/module_connector
      dockerfile: Dockerfile
    container_name: dev-module-connector
    volumes:
      - ./src/module_connector:/app
      - ./pruebas_pipeline:/pruebas_pipeline
    environment:
      - DEVELOPMENT_MODE=true
      - SCRAPER_OUTPUT_DIR=/pruebas_pipeline/scrapy_output/pending
      - PIPELINE_API_URL=http://module_pipeline:8003
    env_file:
      - .env
    networks:
      - pipeline-dev-network
    depends_on:
      - module_pipeline
    restart: unless-stopped

  # --- Module Pipeline ---
  module_pipeline:
    build:
      context: ./src/module_pipeline
      dockerfile: Dockerfile
    container_name: dev-module-pipeline
    command: /bin/sh -c "cd /app && python -m uvicorn src.main:app --host 0.0.0.0 --port 8003 --reload"
    volumes:
      - ./src/module_pipeline:/app
      - ./pruebas_pipeline:/pruebas_pipeline
    ports:
      - "8003:8003"
    environment:
      - DEVELOPMENT_MODE=true
      - DEVELOPMENT_OUTPUT_DIR=/pruebas_pipeline/development_outputs
      - LOG_LEVEL=DEBUG
      - GROQ_MODEL_ID=llama-3.1-8b-instant
    env_file:
      - .env
    networks:
      - pipeline-dev-network
    restart: unless-stopped

  # --- Scrapyd Server ---
  scrapyd:
    build:
      context: ./src/module_scraper
      dockerfile: Dockerfile
    container_name: dev-scrapyd
    volumes:
      - ./src/module_scraper:/app
      - ./src/module_scraper/scrapyd.conf:/etc/scrapyd/scrapyd.conf:ro
      - ./pruebas_pipeline:/pruebas_pipeline
      - scrapyd-dev-eggs:/var/lib/scrapyd/eggs
      - scrapyd-dev-logs:/var/lib/scrapyd/logs
    command: ["scrapyd", "--pidfile="]
    ports:
      - "6800:6800"
    env_file:
      - .env
    networks:
      - pipeline-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6800/daemonstatus.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- ScrapydWeb Dashboard ---
  scrapydweb:
    build:
      context: ./src/module_scraper/scrapydweb
      dockerfile: Dockerfile
    container_name: dev-scrapydweb
    volumes:
      - ./src/module_scraper/scrapydweb/scrapydweb_settings_v11.py:/app/config/scrapydweb_settings_v11.py:ro
      - scrapydweb-dev-data:/var/lib/scrapydweb
      - ./src/module_scraper:/app/projects:ro
      - scrapyd-dev-logs:/var/lib/scrapydweb/scrapyd_logs
    ports:
      - "5000:5000"
    environment:
      - SCRAPYDWEB_SETTINGS_PY=/app/config/scrapydweb_settings_v11.py
      - SCRAPYDWEB_USERNAME=${SCRAPYDWEB_USERNAME}
      - SCRAPYDWEB_PASSWORD=${SCRAPYDWEB_PASSWORD}
      - SCRAPYDWEB_DATA_PATH=/var/lib/scrapydweb
      - SCRAPYDWEB_LOGS_DIR=/var/lib/scrapydweb/logs
      - SCRAPYDWEB_DATABASE_URL=sqlite:////var/lib/scrapydweb/database/scrapydweb.db
      - SCRAPYDWEB_LOCAL_SCRAPYD_LOGS_DIR=/var/lib/scrapydweb/scrapyd_logs
      - PIPELINE_API_URL=http://module_pipeline:8003
    env_file:
      - .env
    networks:
      - pipeline-dev-network
    depends_on:
      - scrapyd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Redis (opcional pero útil para desarrollo) ---
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes
    networks:
      - pipeline-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- FlareSolverr (Cloudflare Bypass) ---
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: dev-flaresolverr
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
      - TZ=America/Caracas
    ports:
      - "8191:8191"
    networks:
      - pipeline-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Volúmenes para persistencia
volumes:
  scrapyd-dev-eggs:
    driver: local
  scrapyd-dev-logs:
    driver: local
  scrapydweb-dev-data:
    driver: local
  redis-dev-data:
    driver: local