  version: "3.0"
  created: "2025-06-30"

config:
  base_path: "/mnt/c/Users/DELL/Desktop/PruebaWindsurfAI/LaMaquinaDeNoticias/src/module_spider_factory_frontend"
  staging_dir: ".cpms3_staging"
  max_retries: 2
  command_timeout: 300
