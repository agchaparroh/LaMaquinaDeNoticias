  - id: "STEP-004"
    description: "Migrar WizardPage para usar el nuevo hook especializado"
    action: "modify_file"
    path: "src/pages/WizardPage.tsx"
    backup: true
    changes:
      - find: |
          import { useSpiderGeneration } from '@hooks/useSpiderGeneration'
        replace: |
          import { useWizardSpiderGeneration } from '@hooks/useWizardSpiderGeneration'
      - find: |
          const {
            currentStep,
            setCurrentStep,
            siteInfo,
            setSiteInfo,
            analysisResult,
            generatedCode,
            isAnalyzing,
            isGenerating,
            analyzeError,
            generateError,
            analyzeSite,
            generateSpider,
            reset
          } = useSpiderGeneration()
        replace: |
          const {
            currentStep,
            setCurrentStep,
            wizardData,
            updateWizardData,
            analysisResult,
            generatedCode,
            isAnalyzing,
            isGenerating,
            analyzeError,
            generateError,
            analyzeSite,
            generateSpider,
            reset
          } = useWizardSpiderGeneration({
            url: '',
            name: '', // Compatibilidad
            medio: '',
            seccion: '',
            area_geografica: '',
            tipo_medio: 'diario',
            frecuencia_minutos: 60,
            rss_url: '',
            comentarios: '',
            tiene_rss: false,
            force_analysis: false
          })
      - find: |
          // Según SECCIÓN 5.1 - Estado local para el wizard EXACTO
          const [wizardData, setWizardData] = useState<WizardData>({
            medio: '',
            seccion: '',
            url: '',
            area_geografica: '',
            tipo_medio: 'diario',
            frecuencia_minutos: 60,
            rss_url: '',
            comentarios: ''
          });

          // Según SECCIÓN 5.2 - Uso en componentes EXACTO
          const [wizardDraft, setWizardDraft] = useLocalStorage('wizard-draft', {});
          const [userPreferences, setUserPreferences] = useLocalStorage('preferences', {
            theme: 'light',
            lastAreaGeografica: '',
            lastTipoMedio: 'diario'
          });
          const { showNotification } = useNotification();

          // Actualizar datos
          const updateWizardData = (updates: Partial<WizardData>) => {
            setWizardData(prev => ({ ...prev, ...updates }));
            setWizardDraft({ ...wizardData, ...updates });
          };

          // Cargar borrador al montar
          useEffect(() => {
            if (Object.keys(wizardDraft).length > 0) {
              setWizardData(prev => ({ ...prev, ...wizardDraft }));
              showNotification('Borrador cargado desde sesión anterior', 'info');
            }
          }, []);
        replace: |
          // Estado local manejado por el hook especializado
          const [wizardDraft, setWizardDraft] = useLocalStorage('wizard-draft', {});
          const [userPreferences, setUserPreferences] = useLocalStorage('preferences', {
            theme: 'light',
            lastAreaGeografica: '',
            lastTipoMedio: 'diario'
          });
          const { showNotification } = useNotification();

          // Actualizar draft cuando wizardData cambia
          useEffect(() => {
            setWizardDraft(wizardData);
          }, [wizardData, setWizardDraft]);

          // Cargar borrador al montar
          useEffect(() => {
            if (Object.keys(wizardDraft).length > 0) {
              updateWizardData(wizardDraft);
              showNotification('Borrador cargado desde sesión anterior', 'info');
            }
          }, []);
      - find: |
          const handleSiteInfoNext = (info: typeof siteInfo) => {
            setSiteInfo(info)
            setCurrentStep(1)
          }
        replace: |
          // Función simplificada - el hook maneja la navegación
          const handleSiteInfoNext = () => {
            setCurrentStep(1)
          }
    verify:
      - type: "file_contains"
        path: "src/pages/WizardPage.tsx"
        text: "useWizardSpiderGeneration"
      - type: "file_contains"
        path: "src/pages/WizardPage.tsx"
        text: "updateWizardData"
      - type: "syntax_valid"
        language: "typescript"
        path: "src/pages/WizardPage.tsx"

  # ========================================
