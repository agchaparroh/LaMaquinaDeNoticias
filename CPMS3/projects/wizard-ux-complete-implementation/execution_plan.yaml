  - id: "CONTENT-001"
    description: "Crear componente de Tooltip reutilizable para ayuda contextual"
    action: "create_file"
    path: "{base_path}/src/components/atoms/HelpTooltip.tsx"
    content: |
      import React from 'react';
      import { Tooltip, IconButton } from '@mui/material';
      import { Help as HelpIcon } from '@mui/icons-material';

      interface HelpTooltipProps {
        title: string;
        placement?: 'top' | 'bottom' | 'left' | 'right';
        size?: 'small' | 'medium';
      }

      const HelpTooltip: React.FC<HelpTooltipProps> = ({ 
        title, 
        placement = 'top',
        size = 'small'
      }) => {
        return (
          <Tooltip title={title} placement={placement} arrow>
            <IconButton 
              size={size}
              sx={{ 
                ml: 0.5,
                color: 'primary.main',
                '&:hover': {
                  backgroundColor: 'primary.light',
                  color: 'primary.contrastText'
                }
              }}
            >
              <HelpIcon fontSize={size} />
            </IconButton>
          </Tooltip>
        );
      };

      export default HelpTooltip;
    verify:
      - type: "file_exists"
        path: "{base_path}/src/components/atoms/HelpTooltip.tsx"
      - type: "file_contains"
        path: "{base_path}/src/components/atoms/HelpTooltip.tsx"
        text: "HelpTooltip"
      - type: "syntax_valid"
        language: "typescript"
        path: "{base_path}/src/components/atoms/HelpTooltip.tsx"

