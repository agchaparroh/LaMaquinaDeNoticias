  - id: "CONTEXTUAL-001"
    description: "Crear componente de ejemplos contextual para mostrar casos de uso"
    action: "create_file"
    path: "{base_path}/src/components/molecules/ExampleShowcase.tsx"
    content: |
      import React, { useState } from 'react';
      import { Box, Typography, Card, CardContent, Button, Collapse, Chip } from '@mui/material';
      import { ExpandMore, ExpandLess, LaunchOutlined } from '@mui/icons-material';

      interface Example {
        medium: string;
        url: string;
        section: string;
        sectionUrl: string;
        description: string;
        category: string;
      }

      interface ExampleShowcaseProps {
        title: string;
        examples: Example[];
      }

      const ExampleShowcase: React.FC<ExampleShowcaseProps> = ({ title, examples }) => {
        const [expanded, setExpanded] = useState(false);

        return (
          <Card sx={{ mt: 2, bgcolor: 'background.paper', border: 1, borderColor: 'divider' }}>
            <CardContent>
              <Box sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <Typography variant="h6" color="primary">
                  💡 {title}
                </Typography>
                <Button
                  endIcon={expanded ? <ExpandLess /> : <ExpandMore />}
                  onClick={() => setExpanded(!expanded)}
                  size="small"
                >
                  {expanded ? 'Ocultar' : 'Ver ejemplos'}
                </Button>
              </Box>
              
              <Collapse in={expanded}>
                <Box sx={{ mt: 2 }}>
                  {examples.map((example, index) => (
                    <Box key={index} sx={{ mb: 2, p: 2, bgcolor: 'grey.50', borderRadius: 1 }}>
                      <Box sx={{ display: 'flex', alignItems: 'center', mb: 1 }}>
                        <Typography variant="subtitle2" sx={{ flexGrow: 1 }}>
                          <strong>{example.medium}</strong>
                        </Typography>
                        <Chip label={example.category} size="small" color="primary" variant="outlined" />
                      </Box>
                      
                      <Typography variant="body2" color="text.secondary" sx={{ mb: 1 }}>
                        {example.description}
                      </Typography>
                      
                      <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.5 }}>
                        <Box sx={{ display: 'flex', alignItems: 'center' }}>
                          <Typography variant="caption" sx={{ minWidth: 80, fontWeight: 'bold' }}>
                            Sitio:
                          </Typography>
                          <Typography variant="caption" sx={{ fontFamily: 'monospace', color: 'primary.main' }}>
                            {example.url}
                          </Typography>
                          <LaunchOutlined sx={{ fontSize: 12, ml: 0.5, color: 'primary.main' }} />
                        </Box>
                        
                        <Box sx={{ display: 'flex', alignItems: 'center' }}>
                          <Typography variant="caption" sx={{ minWidth: 80, fontWeight: 'bold' }}>
                            Sección:
                          </Typography>
                          <Typography variant="caption" sx={{ fontFamily: 'monospace', color: 'secondary.main' }}>
                            {example.sectionUrl}
                          </Typography>
                        </Box>
                      </Box>
                    </Box>
                  ))}
                </Box>
              </Collapse>
            </CardContent>
          </Card>
        );
      };

      export default ExampleShowcase;
    verify:
      - type: "file_exists"
        path: "{base_path}/src/components/molecules/ExampleShowcase.tsx"
      - type: "file_contains"
        path: "{base_path}/src/components/molecules/ExampleShowcase.tsx"
        text: "ExampleShowcase"
      - type: "syntax_valid"
        language: "typescript"
        path: "{base_path}/src/components/molecules/ExampleShowcase.tsx"

