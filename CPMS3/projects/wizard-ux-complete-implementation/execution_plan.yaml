  # ========================================
  # FASE 6: VALIDACIÓN Y FEEDBACK TEMPRANO  
  # ========================================
  - id: "VALIDATION-001"
    description: "Mejorar validación en tiempo real con feedback visual"
    action: "create_file"
    path: "{base_path}/src/components/molecules/SmartURLField.tsx"
    content: |
      import React, { useState, useEffect } from 'react';
      import { TextField, Box, Typography, Chip, CircularProgress, Alert } from '@mui/material';
      import { CheckCircle, Error, Language } from '@mui/icons-material';

      interface SmartURLFieldProps {
        value: string;
        onChange: (value: string) => void;
        onValidation?: (isValid: boolean, info?: any) => void;
        label: string;
        placeholder: string;
        helperText: string;
      }

      const SmartURLField: React.FC<SmartURLFieldProps> = ({ 
        value, onChange, onValidation, label, placeholder, helperText 
      }) => {
        const [isValidating, setIsValidating] = useState(false);
        const [validationResult, setValidationResult] = useState<any>(null);
        const [error, setError] = useState<string | null>(null);

        useEffect(() => {
          if (!value) {
            setValidationResult(null);
            setError(null);
            return;
          }

          const validateURL = async () => {
            setIsValidating(true);
            setError(null);
            
            try {
              const url = new URL(value);
              
              // Simulación de validación (en implementación real conectar con API)
              await new Promise(resolve => setTimeout(resolve, 1000));
              
              const mockInfo = {
                title: `${url.hostname} - Sitio Web Oficial`,
                isAccessible: true,
                hasRSS: Math.random() > 0.5,
                language: 'es',
                sitemap: true
              };
              
              setValidationResult(mockInfo);
              onValidation?.(true, mockInfo);
              
            } catch (err) {
              setError('URL no válida. Verifica el formato (ejemplo: https://elpais.com)');
              onValidation?.(false);
            } finally {
              setIsValidating(false);
            }
          };

          const debounceTimeout = setTimeout(validateURL, 1500);
          return () => clearTimeout(debounceTimeout);
        }, [value, onValidation]);

        return (
          <Box>
            <TextField
              fullWidth
              label={label}
              placeholder={placeholder}
              value={value}
              onChange={(e) => onChange(e.target.value)}
              error={!!error}
              helperText={error || helperText}
              InputProps={{
                endAdornment: isValidating ? (
                  <CircularProgress size={20} />
                ) : validationResult ? (
                  <CheckCircle sx={{ color: 'success.main' }} />
                ) : error ? (
