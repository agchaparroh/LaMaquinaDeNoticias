  # ========================================
  # FASE 7: SISTEMA DE LOGGING
  # ========================================
  - id: "LOGGING-001"
    description: "Crear sistema de logging estructurado para el wizard"
    action: "create_file"
    path: "{base_path}/src/utils/wizardLogger.ts"
    content: |
      // Sistema de logging estructurado para el wizard según MEJORAS_UX_WIZARD_FRONTEND.md
      
      interface WizardLogEvent {
        event: string;
        timestamp: string;
        step: number;
        stepName: string;
        userId?: string;
        sessionId: string;
        data?: any;
        duration?: number;
        error?: any;
      }

      class WizardLogger {
        private sessionId: string;
        private startTime: number;
        private stepStartTimes: Map<number, number> = new Map();

        constructor() {
          this.sessionId = this.generateSessionId();
          this.startTime = Date.now();
          this.logEvent('wizard_started', { sessionId: this.sessionId });
        }

        private generateSessionId(): string {
          return `wizard_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        }

        private logEvent(event: string, additionalData: any = {}) {
          const logEntry: WizardLogEvent = {
            event,
            timestamp: new Date().toISOString(),
            step: additionalData.step || -1,
            stepName: additionalData.stepName || 'unknown',
            sessionId: this.sessionId,
            data: additionalData,
            duration: additionalData.duration
          };

          // Logging en development (visible en DevTools)
          if (import.meta.env.DEV) {
            console.group(`🔍 Wizard Event: ${event}`);
            console.log('📊 Datos:', logEntry);
            console.log('🕐 Timestamp:', logEntry.timestamp);
            if (logEntry.duration) {
              console.log(`⏱️ Duración: ${logEntry.duration}ms`);
            }
            console.groupEnd();
          }

          // En producción solo errores importantes
          if (!import.meta.env.DEV && (event.includes('error') || event.includes('failed'))) {
            console.error('Wizard Error:', logEntry);
          }

          // Enviar a sistema de telemetría si está disponible
          if ((window as any).analytics) {
            (window as any).analytics.track(event, logEntry);
          }
        }

        // Eventos del wizard según especificación
        stepStarted(step: number, stepName: string, data: any = {}) {
          this.stepStartTimes.set(step, Date.now());
          this.logEvent('step_started', { step, stepName, ...data });
        }

        stepCompleted(step: number, stepName: string, data: any = {}) {
          const startTime = this.stepStartTimes.get(step);
          const duration = startTime ? Date.now() - startTime : undefined;
          this.logEvent('step_completed', { step, stepName, duration, ...data });
        }

        urlValidated(url: string, isValid: boolean, validationTime: number) {
          this.logEvent('url_validated', { 
            url, 
            isValid, 
            duration: validationTime,
            domain: isValid ? new URL(url).hostname : null 
          });
        }

        duplicateChecked(url: string, exists: boolean, spiderName?: string) {
          this.logEvent('duplicate_checked', { 
            url, 
            exists, 
            spiderName,
            domain: new URL(url).hostname 
          });
        }

        analysisStarted(url: string, analysisParams: any) {
          this.logEvent('analysis_started', { 
            url, 
            analysisParams,
            domain: new URL(url).hostname 
          });
        }

        analysisCompleted(url: string, strategy: string, analysisTime: number, result: any) {
          this.logEvent('analysis_completed', { 
            url, 
            strategy, 
            duration: analysisTime,
            result,
            domain: new URL(url).hostname 
          });
        }

        spiderGenerated(config: any, generationTime: number, success: boolean) {
          this.logEvent('spider_generated', { 
            config, 
            duration: generationTime, 
            success,
            domain: config.url ? new URL(config.url).hostname : null 
          });
        }

        wizardCompleted(totalTime?: number) {
          const duration = totalTime || (Date.now() - this.startTime);
          this.logEvent('wizard_completed', { 
            duration,
            totalSteps: 4,
            sessionId: this.sessionId 
          });
        }

        wizardAbandoned(step: number, reason?: string) {
          const duration = Date.now() - this.startTime;
          this.logEvent('wizard_abandoned', { 
            step, 
            reason, 
            duration,
            sessionId: this.sessionId 
          });
        }

        errorOccurred(step: number, error: any, context: any = {}) {
          this.logEvent('wizard_error', { 
            step, 
            error: {
              message: error.message,
              stack: error.stack,
              type: error.constructor.name
            }, 
            context,
            sessionId: this.sessionId 
          });
        }
      }

      // Singleton para uso global
      export const wizardLogger = new WizardLogger();
    verify:
      - type: "file_exists"
        path: "{base_path}/src/utils/wizardLogger.ts"
      - type: "file_contains"
        path: "{base_path}/src/utils/wizardLogger.ts"
        text: "WizardLogger"
      - type: "syntax_valid"
        language: "typescript"
        path: "{base_path}/src/utils/wizardLogger.ts"

