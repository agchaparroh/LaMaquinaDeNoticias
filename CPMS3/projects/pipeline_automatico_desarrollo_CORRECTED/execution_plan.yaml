      ## 🚀 Casos de Uso - SEGÚN ESPECIFICACIÓN

      ### **Caso 1: Desarrollo y Testing**
      ```bash
      # Activar modo desarrollo
      export DEVELOPMENT_MODE=true
      export ENABLE_PIPELINE_EXPORT=true

      # Ejecutar spiders
      docker-compose exec scrapyd scrapyd-client deploy scraper_core
      docker-compose exec scrapyd curl http://localhost:6800/schedule.json -d project=scraper_core -d spider=centroamerica360_region

      # Resultados: 
      # - Artículos en Supabase (almacenamiento directo)
      # - Procesamiento LLM completo guardado en /data/development_outputs/
      ```

      ### **Caso 2: Producción**
      ```bash
      # Modo producción normal
      export DEVELOPMENT_MODE=false
      export ENABLE_PIPELINE_EXPORT=true

      # Todo va a Supabase, sin archivos locales
      docker-compose up
      ```

