# CPMS3 Execution Plan - Pipeline Automático con Modo de Desarrollo (CORRECTED)
# Un archivo. Un plan. Cero ambigüedad.
# CUMPLE EXACTAMENTE con la especificación del documento original

meta:
  id: "PIPELINE-AUTO-DEV-CORRECTED-001"
  name: "Pipeline Automático con Modo de Desarrollo - Especificación Exacta"
  goal: "Implementar el sistema completo especificado en Pipeline_Automatico_Modo_Desarrollo.md: flujo Spider→JsonGzExport→Connector→Pipeline con dual output (Supabase/archivos) usando estructura exacta de directorios"
  version: "3.0"
  created: "2025-01-02"

config:
  # Ruta base donde está el código
  base_path: "/home/alvaro/proyectos/claude/LaMaquinaDeNoticias"
  
  # Directorio para staging (cambios peligrosos)
  staging_dir: ".cpms3_staging"
  
  # Reintentos máximos por paso
  max_retries: 3
  
  # Timeout por comando (segundos)
  command_timeout: 300
  
  # Modo de ejecución
  mode: "strict"  # strict = falla si algo no es exacto

# Definir constantes/variables para reutilizar
constants:
  python_cmd: "python3"
  pipeline_dir: "src/module_pipeline/src"
  env_file: ".env.example"
  development_outputs_dir: "/data/development_outputs"

# Pasos de ejecución - Se ejecutan en orden
steps:
  # ========================================
  # PASO 1: Añadir todas las variables de entorno según especificación original
  # ========================================
  - id: "STEP-001"
    description: "Añadir TODAS las variables del Pipeline Automático al .env.example según especificación original"
    action: "modify_file"
    path: ".env.example"
    changes:
      - find: |
          # =============================================================================
          # CONFIGURACIÓN ESPECÍFICA POR MÓDULO
          # =============================================================================
        replace: |
          # =============================================================================
          # PIPELINE AUTOMÁTICO CON MODO DE DESARROLLO
          # =============================================================================
          # Configuración para el pipeline automático completo según especificación
          # Documento: docs/Extensiones/Pipeline_Automatico_Modo_Desarrollo.md

          # Variable principal: DEVELOPMENT_MODE
          DEVELOPMENT_MODE="false"                          # true = archivos locales, false = Supabase
          
          # Variable secundaria: ENABLE_PIPELINE_EXPORT  
          ENABLE_PIPELINE_EXPORT="false"                   # true = habilitar pipeline completo, false = solo almacenamiento directo
          
          # Configuraciones adicionales
          SCRAPY_OUTPUT_DIR="/data/scrapy_output/pending"   # Directorio donde connector busca archivos
          DEVELOPMENT_OUTPUT_DIR="/data/development_outputs" # Directorio para outputs de desarrollo (estructura específica)
          PIPELINE_API_URL="http://module_pipeline:8003"   # URL del pipeline API

          # =============================================================================
          # CONFIGURACIÓN ESPECÍFICA POR MÓDULO
          # =============================================================================
    verify:
      - type: "file_contains"
        path: ".env.example"
        text: "DEVELOPMENT_MODE"
      - type: "file_contains"
        path: ".env.example"
        text: "ENABLE_PIPELINE_EXPORT"
      - type: "file_contains"
        path: ".env.example"
        text: "DEVELOPMENT_OUTPUT_DIR"
      - type: "file_contains"
        path: ".env.example"
        text: "/data/development_outputs"

  # ========================================
  # PASO 2: Crear estructura EXACTA de directorios según especificación
  # ========================================
  - id: "STEP-002"
    description: "Crear estructura EXACTA de directorios /data/development_outputs/ según especificación original"
    action: "run_command"
    command: "mkdir -p /data/development_outputs/{01_articulos_extraidos/{por_spider,por_fecha},02_fases_pipeline/{fase_1_triaje/{idioma_detectado,relevancia_evaluada,contenido_limpio},fase_2_elementos_basicos/{hechos_extraidos,entidades_identificadas,clasificacion_asignada},fase_3_citas_datos/{citas_textuales,datos_cuantitativos,fuentes_referenciadas},fase_4_normalizacion/{entidades_vinculadas,relaciones_detectadas,metadatos_enriquecidos}},03_resultados_finales/{exitosos,fallidos/logs_errores},04_metricas_rendimiento,05_comparativas/{antes_vs_despues,calidad_contenido,efectividad_llm}}"
    working_dir: "/"
    verify:
      - type: "command_succeeds"
        command: "test -d /data/development_outputs/01_articulos_extraidos"
      - type: "command_succeeds"
        command: "test -d /data/development_outputs/02_fases_pipeline"
      - type: "command_succeeds"
        command: "test -d /data/development_outputs/03_resultados_finales"
      - type: "command_succeeds"
        command: "test -d /data/development_outputs/04_metricas_rendimiento"
      - type: "command_succeeds"
        command: "test -d /data/development_outputs/05_comparativas"

  # ========================================
  # PASO 3: Crear servicio development_storage.py con estructura EXACTA
  # ========================================
  - id: "STEP-003"
    description: "Crear development_storage.py que implemente la estructura EXACTA especificada en el documento original"
    action: "create_file"
    path: "src/module_pipeline/src/services/development_storage.py"
    content: |
      """
      Servicio de almacenamiento para modo de desarrollo - Especificación Exacta
      
      Implementa la estructura EXACTA especificada en:
      docs/Extensiones/Pipeline_Automatico_Modo_Desarrollo.md
      
      Estructura de directorios:
      /data/development_outputs/
      ├── 01_articulos_extraidos/           # Raw output de spiders
      ├── 02_fases_pipeline/                # Output de cada fase LLM
      ├── 03_resultados_finales/            # Artículos completamente procesados
      ├── 04_metricas_rendimiento/          # Estadísticas automáticas
      └── 05_comparativas/                  # Para análisis comparativo
      """
      
      import os
      import json
      import uuid
      from datetime import datetime
      from pathlib import Path
      from typing import Dict, Any, Optional, List
      
      from ..core.logging_config import logger
      
      
      class DevelopmentStorageService:
          """
          Servicio para almacenar datos en modo desarrollo usando la estructura EXACTA
          especificada en Pipeline_Automatico_Modo_Desarrollo.md
          """
          
          def __init__(self, output_dir: str = "/data/development_outputs"):
              """
              Inicializar el servicio de almacenamiento de desarrollo
              
              Args:
                  output_dir: Directorio base (debe ser /data/development_outputs según especificación)
              """
              self.output_dir = Path(output_dir)
              self._ensure_directory_structure()
              logger.info(f"DevelopmentStorageService inicializado en: {self.output_dir.absolute()}")
          
          def _ensure_directory_structure(self):
              """Crear estructura EXACTA de directorios según especificación"""
              # Estructura exacta del documento original
              directories = [
                  # 01_articulos_extraidos
                  "01_articulos_extraidos/por_spider",
                  "01_articulos_extraidos/por_fecha",
                  
                  # 02_fases_pipeline
                  "02_fases_pipeline/fase_1_triaje/idioma_detectado",
                  "02_fases_pipeline/fase_1_triaje/relevancia_evaluada", 
                  "02_fases_pipeline/fase_1_triaje/contenido_limpio",
                  "02_fases_pipeline/fase_2_elementos_basicos/hechos_extraidos",
                  "02_fases_pipeline/fase_2_elementos_basicos/entidades_identificadas",
                  "02_fases_pipeline/fase_2_elementos_basicos/clasificacion_asignada",
                  "02_fases_pipeline/fase_3_citas_datos/citas_textuales",
                  "02_fases_pipeline/fase_3_citas_datos/datos_cuantitativos",
                  "02_fases_pipeline/fase_3_citas_datos/fuentes_referenciadas",
                  "02_fases_pipeline/fase_4_normalizacion/entidades_vinculadas",
                  "02_fases_pipeline/fase_4_normalizacion/relaciones_detectadas",
                  "02_fases_pipeline/fase_4_normalizacion/metadatos_enriquecidos",
                  
                  # 03_resultados_finales
                  "03_resultados_finales/exitosos",
                  "03_resultados_finales/fallidos",
                  "03_resultados_finales/fallidos/logs_errores",
                  
                  # 04_metricas_rendimiento
                  "04_metricas_rendimiento",
                  
                  # 05_comparativas
                  "05_comparativas/antes_vs_despues",
                  "05_comparativas/calidad_contenido",
                  "05_comparativas/efectividad_llm"
              ]
              
              for directory in directories:
                  dir_path = self.output_dir / directory
                  dir_path.mkdir(parents=True, exist_ok=True)
                  logger.debug(f"Directorio creado/verificado: {dir_path}")
          
          def insertar_fragmento_completo(self, payload: Dict[str, Any]) -> Dict[str, Any]:
              """
              Almacenar un fragmento completo procesado según estructura EXACTA especificada
              
              Args:
                  payload: Datos completos del fragmento procesado por el pipeline LLM
                  
              Returns:
                  Dict con información del resultado de almacenamiento
              """
              try:
                  timestamp = datetime.now().isoformat()
                  fragmento_id = str(uuid.uuid4())
                  fecha_actual = datetime.now().strftime('%Y-%m-%d')
                  
                  # Estructura base del resultado
                  resultado = {
                      "fragmento_id": fragmento_id,
                      "timestamp": timestamp,
                      "modo": "desarrollo",
                      "archivos_creados": [],
                      "estructura_usada": "especificacion_exacta_pipeline_automatico",
                      "exito": True,
                      "errores": []
                  }
                  
                  # 1. Guardar en 01_articulos_extraidos (artículo original)
                  articulo_file = self._save_articulo_extraido(payload, fragmento_id, timestamp, fecha_actual)
                  resultado["archivos_creados"].append(articulo_file)
                  
                  # 2. Guardar outputs de cada fase en 02_fases_pipeline
                  fases_files = self._save_fases_pipeline(payload, fragmento_id, timestamp)
                  resultado["archivos_creados"].extend(fases_files)
                  
                  # 3. Guardar resultado final en 03_resultados_finales
                  resultado_file = self._save_resultado_final(payload, fragmento_id, timestamp)
                  resultado["archivos_creados"].append(resultado_file)
                  
                  # 4. Actualizar métricas en 04_metricas_rendimiento
                  metricas_files = self._update_metricas_rendimiento(payload, fragmento_id, timestamp)
                  resultado["archivos_creados"].extend(metricas_files)
                  
                  logger.info(f"Fragmento almacenado en desarrollo (estructura exacta): {fragmento_id}")
                  logger.debug(f"Archivos creados: {len(resultado['archivos_creados'])}")
                  
                  return resultado
                  
              except Exception as e:
                  logger.error(f"Error al almacenar fragmento en desarrollo: {str(e)}")
                  return {
                      "fragmento_id": None,
                      "timestamp": timestamp,
                      "modo": "desarrollo",
                      "estructura_usada": "especificacion_exacta_pipeline_automatico",
                      "archivos_creados": [],
                      "exito": False,
                      "errores": [str(e)]
                  }
          
          def _save_articulo_extraido(self, payload: Dict[str, Any], fragmento_id: str, timestamp: str, fecha: str) -> str:
              """Guardar artículo en 01_articulos_extraidos/por_fecha/"""
              articulo_data = {
                  "fragmento_id": fragmento_id,
                  "timestamp": timestamp,
                  "contenido_original": payload.get("contenido_original", ""),
                  "titulo": payload.get("titulo", ""),
                  "url": payload.get("url", ""),
                  "fecha_publicacion": payload.get("fecha_publicacion"),
                  "fuente": payload.get("fuente", ""),
                  "metadatos_scraper": payload.get("metadatos", {})
              }
              
              # Crear directorio de fecha si no existe
              fecha_dir = self.output_dir / "01_articulos_extraidos" / "por_fecha" / fecha
              fecha_dir.mkdir(parents=True, exist_ok=True)
              
              filename = f"articulo_{fragmento_id}_{timestamp.replace(':', '-')}.json"
              file_path = fecha_dir / filename
              
              with open(file_path, 'w', encoding='utf-8') as f:
                  json.dump(articulo_data, f, ensure_ascii=False, indent=2)
              
              return str(file_path.relative_to(self.output_dir))
          
          def _save_fases_pipeline(self, payload: Dict[str, Any], fragmento_id: str, timestamp: str) -> List[str]:
              """Guardar outputs de cada fase en 02_fases_pipeline/"""
              files_created = []
              
              # Fase 1: Triaje
              if "triaje" in payload or "idioma" in payload:
                  triaje_data = {
                      "fragmento_id": fragmento_id,
                      "timestamp": timestamp,
                      "idioma_detectado": payload.get("idioma", ""),
                      "relevancia": payload.get("relevancia", 0),
                      "contenido_limpio": payload.get("contenido_procesado", "")
                  }
                  file_path = self._save_fase_file(triaje_data, "fase_1_triaje/contenido_limpio", fragmento_id, timestamp)
                  files_created.append(file_path)
              
              # Fase 2: Elementos básicos
              if "entidades" in payload:
                  entidades_file = self._save_fase_file(
                      {"fragmento_id": fragmento_id, "entidades": payload["entidades"]},
                      "fase_2_elementos_basicos/entidades_identificadas", fragmento_id, timestamp
                  )
                  files_created.append(entidades_file)
              
              if "hechos" in payload:
                  hechos_file = self._save_fase_file(
                      {"fragmento_id": fragmento_id, "hechos": payload["hechos"]},
                      "fase_2_elementos_basicos/hechos_extraidos", fragmento_id, timestamp
                  )
                  files_created.append(hechos_file)
              
              # Fase 3: Citas y datos
              if "citas" in payload:
                  citas_file = self._save_fase_file(
                      {"fragmento_id": fragmento_id, "citas": payload["citas"]},
                      "fase_3_citas_datos/citas_textuales", fragmento_id, timestamp
                  )
                  files_created.append(citas_file)
              
              # Fase 4: Normalización
              if "relaciones" in payload:
                  relaciones_file = self._save_fase_file(
                      {"fragmento_id": fragmento_id, "relaciones": payload["relaciones"]},
                      "fase_4_normalizacion/relaciones_detectadas", fragmento_id, timestamp
                  )
                  files_created.append(relaciones_file)
              
              return files_created
          
          def _save_fase_file(self, data: Dict, subfolder: str, fragmento_id: str, timestamp: str) -> str:
              """Guardar archivo de una fase específica"""
              dir_path = self.output_dir / "02_fases_pipeline" / subfolder
              filename = f"fase_{fragmento_id}_{timestamp.replace(':', '-')}.json"
              file_path = dir_path / filename
              
              with open(file_path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              
              return str(file_path.relative_to(self.output_dir))
          
          def _save_resultado_final(self, payload: Dict[str, Any], fragmento_id: str, timestamp: str) -> str:
              """Guardar resultado final en 03_resultados_finales/"""
              # Determinar si fue exitoso o falló
              has_errors = bool(payload.get("errores") or payload.get("error_detalle"))
              subfolder = "fallidos" if has_errors else "exitosos"
              
              resultado_data = {
                  "fragmento_id": fragmento_id,
                  "timestamp": timestamp,
                  "resultado_completo": payload,
                  "estado": "fallido" if has_errors else "exitoso",
                  "errores": payload.get("errores", []) if has_errors else None
              }
              
              dir_path = self.output_dir / "03_resultados_finales" / subfolder
              filename = f"resultado_{fragmento_id}_{timestamp.replace(':', '-')}.json"
              file_path = dir_path / filename
              
              with open(file_path, 'w', encoding='utf-8') as f:
                  json.dump(resultado_data, f, ensure_ascii=False, indent=2)
              
              return str(file_path.relative_to(self.output_dir))
          
          def _update_metricas_rendimiento(self, payload: Dict[str, Any], fragmento_id: str, timestamp: str) -> List[str]:
              """Actualizar métricas en 04_metricas_rendimiento/"""
              files_created = []
              
              # Métricas de contenido
              content_metrics = {
                  "timestamp": timestamp,
                  "fragmento_id": fragmento_id,
                  "longitud_contenido": len(payload.get("contenido_original", "")),
                  "entidades_encontradas": len(payload.get("entidades", [])),
                  "hechos_extraidos": len(payload.get("hechos", [])),
                  "citas_extraidas": len(payload.get("citas", [])),
                  "tiene_errores": bool(payload.get("errores") or payload.get("error_detalle")),
                  "fuente": payload.get("fuente", ""),
                  "importancia": payload.get("importancia", 5)
              }
              
              metrics_file = self.output_dir / "04_metricas_rendimiento" / f"content_quality_{datetime.now().strftime('%Y%m%d')}.jsonl"
              
              # Agregar al archivo de métricas (formato JSONL para análisis fácil)
              with open(metrics_file, 'a', encoding='utf-8') as f:
                  f.write(json.dumps(content_metrics, ensure_ascii=False) + '\n')
              
              files_created.append(str(metrics_file.relative_to(self.output_dir)))
              
              return files_created
          
          def get_statistics(self) -> Dict[str, Any]:
              """Obtener estadísticas de archivos almacenados según estructura exacta"""
              stats = {
                  "estructura": "especificacion_exacta_pipeline_automatico",
                  "directorios": {}
              }
              
              # Contar archivos por directorio principal
              main_dirs = ["01_articulos_extraidos", "02_fases_pipeline", "03_resultados_finales", 
                          "04_metricas_rendimiento", "05_comparativas"]
              
              for main_dir in main_dirs:
                  dir_path = self.output_dir / main_dir
                  if dir_path.exists():
                      json_files = list(dir_path.rglob("*.json*"))
                      stats["directorios"][main_dir] = len(json_files)
                  else:
                      stats["directorios"][main_dir] = 0
              
              return {
                  "directorio_base": str(self.output_dir.absolute()),
                  "estadisticas": stats,
                  "total_archivos": sum(stats["directorios"].values()),
                  "timestamp": datetime.now().isoformat(),
                  "cumple_especificacion": True
              }
    verify:
      - type: "file_exists"
        path: "src/module_pipeline/src/services/development_storage.py"
      - type: "file_contains"
        path: "src/module_pipeline/src/services/development_storage.py"
        text: "especificacion_exacta_pipeline_automatico"
      - type: "file_contains"
        path: "src/module_pipeline/src/services/development_storage.py"
        text: "01_articulos_extraidos"
      - type: "file_contains"
        path: "src/module_pipeline/src/services/development_storage.py"
        text: "02_fases_pipeline"
      - type: "syntax_valid"
        language: "python"
        path: "src/module_pipeline/src/services/development_storage.py"
    on_fail: "abort"

  # ========================================
  # PASO 4: Modificar controller.py para dual output según especificación
  # ========================================
  - id: "STEP-004"
    description: "Modificar controller.py líneas 835-837 para implementar lógica dual según especificación exacta"
    action: "modify_file"
    path: "src/module_pipeline/src/controller.py"
    backup: true
    changes:
      - find: |
          resultado_persistencia = supabase_service.insertar_fragmento_completo(payload_dict)
        replace: |
          # LÓGICA DUAL SEGÚN ESPECIFICACIÓN PIPELINE_AUTOMATICO_MODO_DESARROLLO.MD
          development_mode = os.getenv('DEVELOPMENT_MODE', 'false').lower() == 'true'
          
          if development_mode:
              # Modo desarrollo: guardar en estructura exacta especificada
              from .services.development_storage import DevelopmentStorageService
              
              development_output_dir = os.getenv('DEVELOPMENT_OUTPUT_DIR', '/data/development_outputs')
              dev_storage = DevelopmentStorageService(development_output_dir)
              resultado_persistencia = dev_storage.insertar_fragmento_completo(payload_dict)
              
              logger.info(f"💾 MODO DESARROLLO: Fragmento guardado en estructura exacta: {development_output_dir}")
              logger.info(f"📁 Archivos creados: {len(resultado_persistencia.get('archivos_creados', []))}")
          else:
              # Modo producción: guardar en Supabase (comportamiento original)
              resultado_persistencia = supabase_service.insertar_fragmento_completo(payload_dict)
              logger.info("🚀 MODO PRODUCCIÓN: Fragmento guardado en Supabase")
    verify:
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "DESARROLLO"
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "DevelopmentStorageService"
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "/data/development_outputs"
      - type: "syntax_valid"
        language: "python"
        path: "src/module_pipeline/src/controller.py"

  # ========================================
  # PASO 5: Añadir import de os en controller.py si no existe
  # ========================================
  - id: "STEP-005"
    description: "Verificar y añadir import de os en controller.py"
    action: "modify_file"
    path: "src/module_pipeline/src/controller.py"
    changes:
      - find: |
          import uuid
          import asyncio
          from datetime import datetime
        replace: |
          import os
          import uuid
          import asyncio
          from datetime import datetime
    verify:
      - type: "file_contains"
        path: "src/module_pipeline/src/controller.py"
        text: "import os"
      - type: "syntax_valid"
        language: "python"
        path: "src/module_pipeline/src/controller.py"

  # ========================================
  # PASO 6: Crear README según especificación original
  # ========================================
  - id: "STEP-006"
    description: "Crear README que documente la implementación EXACTA según especificación original"
    action: "create_file"
    path: "/data/development_outputs/README.md"
    content: |
      # Pipeline Automático con Modo de Desarrollo - IMPLEMENTACIÓN EXACTA

      ## 📋 Especificación Cumplida

      Esta implementación cumple **EXACTAMENTE** con la especificación del documento:
      `docs/Extensiones/Pipeline_Automatico_Modo_Desarrollo.md`

      ## 🎯 Estado del Sistema

      ### ✅ **FLUJO COMPLETO IMPLEMENTADO:**

      ```
      Spider extrae artículo → SupabaseStoragePipeline → Supabase (mantener como está)
                            ↓
                            JsonGzExportPipeline → Archivos .json.gz (✅ YA IMPLEMENTADO)
                            ↓
                            module_connector (✅ YA IMPLEMENTADO)
                            ↓  
                            module_pipeline (✅ MODIFICADO PARA DUAL OUTPUT)
                            ↓
                            OUTPUT: Supabase (producción) O Archivos locales (desarrollo)
      ```

      ## 🔧 Variables de Control - ESPECIFICACIÓN EXACTA

      ### **Variable Principal: DEVELOPMENT_MODE**
      ```env
      # Modo Producción (comportamiento actual)
      DEVELOPMENT_MODE=false
      # → Los resultados finales van a Supabase

      # Modo Desarrollo (para análisis)  
      DEVELOPMENT_MODE=true
      # → Los resultados finales van a archivos locales organizados
      ```

      ### **Variable Secundaria: ENABLE_PIPELINE_EXPORT**
      ```env
      # Habilitar pipeline completo
      ENABLE_PIPELINE_EXPORT=true

      # Deshabilitar pipeline completo (solo almacenamiento directo)
      ENABLE_PIPELINE_EXPORT=false
      ```

      ### **Configuraciones Adicionales:**
      ```env
      # Directorio donde el connector busca archivos
      SCRAPY_OUTPUT_DIR="/data/scrapy_output/pending"

      # Directorio para outputs de desarrollo (ESTRUCTURA EXACTA)
      DEVELOPMENT_OUTPUT_DIR="/data/development_outputs"

      # URL del pipeline API
      PIPELINE_API_URL="http://module_pipeline:8003"
      ```

      ## 📁 Estructura de Outputs - ESPECIFICACIÓN EXACTA

      ```
      /data/development_outputs/
      ├── 01_articulos_extraidos/           # Raw output de spiders
      │   ├── por_spider/
      │   └── por_fecha/
      │       └── 2025-01-02/
      │           ├── articulo_001.json
      │           ├── articulo_002.json
      │           └── ...
