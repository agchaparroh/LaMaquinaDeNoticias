  - id: "A11Y-002"
    description: "Implementar navegación por teclado en WizardPage"
    action: "modify_file"
    path: "{base_path}/{wizard_page_path}"
    backup: true
    changes:
      - find: |
          import { useState, useEffect } from 'react'
          import { useWizardSpiderGeneration } from '@hooks/useWizardSpiderGeneration'
        replace: |
          import { useState, useEffect, useCallback } from 'react'
          import { useWizardSpiderGeneration } from '@hooks/useWizardSpiderGeneration'
      - find: |
          const { showNotification } = useNotification();
        replace: |
          const { showNotification } = useNotification();

          // Navegación por teclado para accesibilidad
          const handleKeyDown = useCallback((event: KeyboardEvent) => {
            // Solo actuar si el foco está en el wizard (no en inputs)
            if (event.target instanceof HTMLInputElement || 
                event.target instanceof HTMLTextAreaElement ||
                event.target instanceof HTMLSelectElement) {
              return;
            }

            switch (event.key) {
              case 'Enter':
                event.preventDefault();
                // Avanzar al siguiente paso si es posible
                if (currentStep < steps.length - 1) {
                  if (currentStep === 0 && wizardData.url && wizardData.medio) {
                    handleSiteInfoNext();
                  } else if (currentStep === 1 && wizardData.seccion && wizardData.url) {
                    if (wizardData.seccion && wizardData.url) {
                      analyzeSite();
                    }
                  } else if (currentStep === 2 && analysisResult) {
                    handleAnalysisNext();
                  }
                }
                break;
              case 'Escape':
                event.preventDefault();
                // Retroceder al paso anterior si es posible
                if (currentStep > 0) {
                  handleBack();
                }
                break;
            }
          }, [currentStep, wizardData, analysisResult, handleSiteInfoNext, analyzeSite, handleAnalysisNext, handleBack]);

          // Agregar/remover event listener para navegación por teclado
          useEffect(() => {
            document.addEventListener('keydown', handleKeyDown);
            return () => {
              document.removeEventListener('keydown', handleKeyDown);
            };
          }, [handleKeyDown]);
    verify:
      - type: "file_contains"
        path: "{base_path}/{wizard_page_path}"
        text: "handleKeyDown"
      - type: "file_contains"
        path: "{base_path}/{wizard_page_path}"
        text: "addEventListener"
      - type: "syntax_valid"
        language: "typescript"
        path: "{base_path}/{wizard_page_path}"

  - id: "A11Y-003"
