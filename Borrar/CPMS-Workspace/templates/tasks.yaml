# Plantilla de tareas CPMS
# Cada tarea debe contener toda la información necesaria para ejecutarse autónomamente

tasks:
  - id: "TASK-001"
    title: "{task_title}"
    description: "{task_description}"
    priority: 1  # 1-5, donde 1 es la más alta
    status: "pending"  # pending, in_progress, blocked, completed, cancelled
    estimated_hours: 0
    assigned_to: null
    dependencies: []  # IDs de tareas que deben completarse antes
    
    # CAMPO OBLIGATORIO: Criterios específicos y verificables
    acceptance_criteria:
      - [ ] "{criterion_1}"
      - [ ] "{criterion_2}"
      - [ ] "{criterion_3}"
      # Criterios específicos, medibles y verificables
    
    # CAMPO OBLIGATORIO: Instrucciones detalladas de implementación
    implementation_details: |
      ANTES DE COMENZAR: Consultar documentación oficial de [biblioteca]:
      ```bash
      # Paso 1: Buscar el ID de la librería
      mcp__context7__resolve-library-id --libraryName "[biblioteca]"
      # Paso 2: Con el ID obtenido, obtener docs
      mcp__context7__get-library-docs --context7CompatibleLibraryID "[id]" --topic "[topics]"
      ```
      
      ### Sección 1: [Título]
      UBICACIÓN: {code_location}/path/to/file.py (líneas ~XX-YY)
      
      CAMBIOS NECESARIOS:
      ```python
      # Código exacto a implementar
      ```
      
      NOTAS IMPORTANTES:
      - Mantener retrocompatibilidad con [componente]
      - Verificar que [condición]
    
    # Comandos específicos para Context7 si aplica
    context7_queries:
      commands:
        - "mcp__context7__resolve-library-id --libraryName '[biblioteca]'"
        - "mcp__context7__get-library-docs --context7CompatibleLibraryID '[id]' --topic '[topics]'"
    
    # CAMPO OBLIGATORIO: Comandos de verificación
    verification_command: |
      # Verificación con rutas absolutas (compatible con WSL)
      echo "=== Verificando implementación de {task_title} ==="
      
      # 1. Verificar sintaxis
      python3 -m py_compile {code_location}/path/to/file.py
      echo "✓ Sintaxis correcta"
      
      # 2. Ejecutar tests específicos
      python3 -m pytest {code_location}/tests/test_feature.py -v
      
      # 3. Verificación manual
      echo "MANUAL: Verificar que [condición específica]"
      
      # 4. Checklist
      echo "[ ] ¿Todos los criterios de aceptación cumplidos?"
      echo "[ ] ¿Tests pasando?"
      echo "[ ] ¿Sin errores en logs?"
    
    # Subtareas si es necesario descomponer
    subtasks: []
    
    # Notas adicionales
    notes: |
      - Esta tarea es crítica para [razón]
      - Considerar [aspecto importante]
    
    # Documentación de problemas encontrados
    problems_found: []
    
    # Decisiones autónomas tomadas durante la implementación
    autonomous_decisions: []

# Notas críticas de arquitectura aplicables a todas las tareas
architecture_critical_notes: |
  ## 🚨 CRITICAL: Restricciones de Arquitectura
  
  [Incluir restricciones arquitectónicas del proyecto]
  
  ## 📋 Estándares de Código
  
  [Incluir estándares específicos del proyecto]
  
  ## 🔧 Configuración de Entorno
  
  [Incluir configuración específica del proyecto]