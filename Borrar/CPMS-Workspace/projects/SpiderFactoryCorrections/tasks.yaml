      ```python
      class GenerateSpiderRequest(BaseModel):
          medio: str = Field(..., description="Nombre del medio")
          seccion: str = Field(..., description="Sección del medio")
          url: HttpUrl = Field(..., description="URL del sitio web")
          area_geografica: str = Field(..., description="Área geográfica del medio")
          tipo_medio: Literal["diario", "revista", "agencia"]
          frecuencia_minutos: Optional[int] = Field(60, description="Frecuencia de actualización")
          rss_url: Optional[HttpUrl] = Field(None, description="URL del RSS")
          comentarios: Optional[str] = Field(None, description="Comentarios adicionales")
          
          @computed_field
          @property
          def spider_name(self) -> str:
              """Genera automáticamente el spider_name como {medio}_{seccion}"""
              return f"{self.medio}_{self.seccion}"
      ```
      
      ## 2. Nuevo modelo DuplicateCheckRequest creado
