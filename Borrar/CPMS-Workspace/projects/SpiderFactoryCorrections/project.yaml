risk_mitigation:
  - risk: "Incompatibilidad con spiders existentes"
    mitigation: "Migración gradual con campos opcionales primero"
  
  - risk: "Cambios rompen el frontend"
    mitigation: "Mantener retrocompatibilidad en API, testing exhaustivo"
  
  - risk: "Performance con batches grandes"
    mitigation: "Límites estrictos (100 items), procesamiento asíncrono"
  
  - risk: "Errores en templates generados"
    mitigation: "Validación de sintaxis, formateo con Black, tests de generación"

conventions:
  code_style: "PEP 8 con Black formatter"
  naming:
    - "snake_case para funciones y variables"
    - "PascalCase para clases"
    - "UPPER_CASE para constantes"
    - "Prefijo underscore para métodos privados"
  
  git_commits: "Conventional Commits (feat:, fix:, docs:, test:, refactor:)"
  
  docstrings: |
    """
    Descripción breve de la función.
    
    Args:
        param1: Descripción del parámetro
        param2: Descripción del parámetro
    
    Returns:
        Descripción del retorno
    
    Raises:
        ExceptionType: Cuándo se lanza
    """
  
  error_handling: "Try/except específicos con logging detallado"
  
  imports: |
    # Orden de imports
    1. Standard library
    2. Third party
    3. Local imports
    
    # Separados por línea en blanco

getting_started: |
  Para comenzar a trabajar en este proyecto:
  
  1. Ejecuta: "Carga proyecto SpiderFactoryCorrections desde CPMS-Workspace/projects"
  2. Lee workflow.md para entender el proceso de trabajo
  3. Lee DONT_FORGET.md para recordatorios críticos
  4. Comienza con TASK-001 siguiendo workflow_instructions
  
  IMPORTANTE: Toda la información técnica está en implementation_details de cada tarea.
  No necesitas acceso a documentos externos.
  
  AUTONOMÍA: Este proyecto está diseñado para ejecutarse sin intervención del usuario.
  - NO pidas confirmación para realizar cambios
  - NO preguntes si debes continuar
  - SI encuentras errores, documenta en problems_found y continúa
  - SI algo no está claro, usa tu mejor criterio basado en implementation_details
  - EJECUTA cada tarea de principio a fin antes de pasar a la siguiente

notes:
  - "Plan detallado en: CPMS-Workspace/projects/Proyectos pendientes/PLAN_CORRECCION_BACKEND.md"
  - "Arquitectura original en: Investigación/Conclusiones/SPIDER_FACTORY_2.0_PLAN_DETALLADO.md"
  - "CRITICAL: Respetar arquitectura Docker/NGINX existente"
  - "Revisar documentación de FastAPI, Pydantic, Redis en Context7 antes de cada tarea"