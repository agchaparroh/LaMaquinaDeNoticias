networks:
  lamacquina_network:
    driver: bridge

services:
  # --- Backend Services (Python/FastAPI) ---
  module_scraper:
    build:
      context: ./src/module_scraper
      dockerfile: Dockerfile
    container_name: lamacquina_scraper
    volumes:
      - ./src/module_scraper:/app
      - shared_data:/data
    env_file:
      - .env
    networks:
      - lamacquina_network
    restart: unless-stopped

  module_connector:
    build:
      context: ./src/module_connector
      dockerfile: Dockerfile
    container_name: lamacquina_connector
    volumes:
      - ./src/module_connector:/app
      - shared_data:/data
    env_file:
      - .env
    networks:
      - lamacquina_network
    restart: unless-stopped
    depends_on:
      - module_pipeline

  module_pipeline:
    build:
      context: ./src/module_pipeline
      dockerfile: Dockerfile
    container_name: lamacquina_pipeline
    command: /bin/sh -c "cd /app && python -m uvicorn src.main:app --host 0.0.0.0 --port 8003"
    volumes:
      - ./src/module_pipeline:/app
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - GROQ_MODEL_ID=llama-3.1-8b-instant
    networks:
      - lamacquina_network
    restart: unless-stopped

  module_dashboard_review_backend:
    build:
      context: ./src/module_dashboard_review_backend
      dockerfile: Dockerfile
    container_name: lamacquina_dashboard_review_backend
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8004 --reload
    volumes:
      - ./src/module_dashboard_review_backend:/app
    ports:
      - "8004:8004"
    env_file:
      - .env
    networks:
      - lamacquina_network
    restart: unless-stopped

  # --- Frontend Services (React/TypeScript served by Nginx) ---
  module_dashboard_review_frontend:
    build:
      context: ./src/module_dashboard_review_frontend
      dockerfile: Dockerfile
    container_name: lamacquina_dashboard_review_frontend
    ports:
      - "3001:80" # Nginx in container serves on 80
    networks:
      - lamacquina_network
    restart: unless-stopped

  # --- Scrapyd Server ---
  scrapyd:
    build:
      context: ./src/module_scraper
      dockerfile: Dockerfile
    container_name: lamacquina_scrapyd
    volumes:
      - ./src/module_scraper:/app
      - ./src/module_scraper/scrapyd.conf:/etc/scrapyd/scrapyd.conf:ro
      - scrapyd_eggs:/var/lib/scrapyd/eggs
      - scrapyd_logs:/var/lib/scrapyd/logs
      - shared_data:/data
    command: ["scrapyd", "--pidfile="]
    ports:
      - "6800:6800"
    env_file:
      - .env
    networks:
      - lamacquina_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6800/daemonstatus.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- ScrapydWeb Dashboard ---
  scrapydweb:
    build:
      context: ./src/module_scraper/scrapydweb
      dockerfile: Dockerfile
    container_name: lamacquina_scrapydweb
    volumes:
      # Configuración
      - ./src/module_scraper/scrapydweb/scrapydweb_settings_v10.py:/app/config/scrapydweb_settings_v10.py:ro
      # Datos persistentes en directorio estándar
      - scrapydweb_data:/var/lib/scrapydweb
      # Proyectos Scrapy (para deploy)
      - ./src/module_scraper:/app/projects:ro
      # Compartir logs de Scrapyd
      - scrapyd_logs:/var/lib/scrapydweb/scrapyd_logs
    ports:
      - "5000:5000"
    environment:
      # Configuración de aplicación
      - SCRAPYDWEB_SETTINGS_PY=/app/config/scrapydweb_settings_v10.py
      - SCRAPYDWEB_USERNAME=${SCRAPYDWEB_USERNAME}
      - SCRAPYDWEB_PASSWORD=${SCRAPYDWEB_PASSWORD}
      # Rutas de datos
      - SCRAPYDWEB_DATA_PATH=/var/lib/scrapydweb
      - SCRAPYDWEB_LOGS_DIR=/var/lib/scrapydweb/logs
      - SCRAPYDWEB_DATABASE_URL=sqlite:////var/lib/scrapydweb/database/scrapydweb.db
      - SCRAPYDWEB_LOCAL_SCRAPYD_LOGS_DIR=/var/lib/scrapydweb/scrapyd_logs
      # Integración con otros servicios
      - PIPELINE_API_URL=http://module_pipeline:8003
      - DASHBOARD_API_URL=http://module_dashboard_review_backend:8004
    env_file:
      - .env
    networks:
      - lamacquina_network
    depends_on:
      - scrapyd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Spider Factory Backend ---
  spider_factory_backend:
    build:
      context: ./src/spider_factory
      dockerfile: Dockerfile
    container_name: lamacquina_spider_factory_backend
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - API_PORT=8000  # Puerto interno del contenedor
    volumes:
      - ./src/spider_factory/generated_spiders:/app/generated_spiders
      - ./src/module_scraper/scraper_core/spiders:/app/output_spiders
    env_file:
      - .env
    networks:
      - lamacquina_network
    depends_on:
      - redis
    restart: unless-stopped

  # --- Spider Factory Frontend ---
  spider_factory_frontend:
    build:
      context: ./src/module_spider_factory_frontend
      dockerfile: Dockerfile
    container_name: lamacquina_spider_factory_frontend
    environment:
      - VITE_API_URL=/spider-factory/api
      - VITE_WS_URL=/spider-factory/ws
      - VITE_BASE_PATH=/spider-factory
    networks:
      - lamacquina_network
    depends_on:
      - spider_factory_backend
    restart: unless-stopped

  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    container_name: lamacquina_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - lamacquina_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- Reverse Proxy (Nginx) ---
  nginx_reverse_proxy:
    build:
      context: ./src/nginx_reverse_proxy
      dockerfile: Dockerfile
    container_name: lamacquina_reverse_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src/nginx_reverse_proxy/config/nginx.conf:/etc/nginx/nginx.conf:ro
      # For SSL certificates:
      # - ./path/to/your/certs:/etc/nginx/certs:ro 
    depends_on:
      - module_scraper
      - module_connector
      - module_pipeline
      - module_dashboard_review_backend
      - module_dashboard_review_frontend
      - spider_factory_backend
      - spider_factory_frontend
    networks:
      - lamacquina_network
    restart: unless-stopped

  # --- FlareSolverr (Cloudflare Bypass Expert Solution) ---
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: lamacquina_flaresolverr
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
      - TZ=America/Caracas
    ports:
      - "8191:8191"  # Expuesto para debug, se puede quitar en producción
    networks:
      - lamacquina_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Volúmenes para persistencia
volumes:
  scrapyd_eggs:
    driver: local
  scrapyd_logs:
    driver: local
  scrapydweb_data:
    driver: local
  redis_data:
    driver: local
  shared_data:
    driver: local