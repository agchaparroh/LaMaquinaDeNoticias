version: '3.8'

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: spider_factory_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spider_factory_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spider_factory_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./generated_spiders:/app/generated_spiders
      - ./logs:/app/logs
      - ./templates:/app/templates
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - spider_factory_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ../module_spider_factory_frontend
      dockerfile: Dockerfile
    container_name: spider_factory_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - spider_factory_network
    restart: unless-stopped

networks:
  spider_factory_network:
    driver: bridge

volumes:
  redis_data:
    driver: local