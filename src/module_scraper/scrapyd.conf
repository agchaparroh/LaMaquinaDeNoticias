# Scrapyd configuration file for La Máquina de Noticias
# This file configures the Scrapyd service for deploying and running Scrapy spiders

[scrapyd]
# Application options
application = scrapyd.app.application

# Network configuration
# Bind to all interfaces to allow external connections within Docker network
bind_address = 0.0.0.0
http_port = 6800

# Authentication (will be configured via environment variables)
# username = ${SCRAPYD_USERNAME}
# password = ${SCRAPYD_PASSWORD}

# Spider queue configuration
spiderqueue = scrapyd.spiderqueue.SqliteSpiderQueue

# Poller options
poller = scrapyd.poller.QueuePoller
poll_interval = 5.0

# Launcher options
launcher = scrapyd.launcher.Launcher
# max_proc = 0 means no limit, will use max_proc_per_cpu instead
max_proc = 0
# 4 processes per CPU core
max_proc_per_cpu = 4

# Directory configuration
# These directories are created in the Dockerfile
logs_dir = /var/lib/scrapyd/logs
items_dir = /var/lib/scrapyd/items
dbs_dir = /var/lib/scrapyd/dbs
eggs_dir = /var/lib/scrapyd/eggs

# Job retention settings
jobs_to_keep = 10
finished_to_keep = 100

# Runner configuration
runner = scrapyd.runner

# Web UI and API options
webroot = scrapyd.website.Root
# For reverse proxy support
prefix_header = x-forwarded-prefix
# Debug mode (disable in production)
debug = off

# Egg storage options
eggstorage = scrapyd.eggstorage.FilesystemEggStorage

# Job storage options
jobstorage = scrapyd.jobstorage.MemoryJobStorage

# Node name (useful for multi-node setups)
node_name = ${HOSTNAME}

# Environment-specific settings
# These can be overridden by environment variables in Docker
# [scrapyd:docker]
# max_proc_per_cpu = 2
# debug = on